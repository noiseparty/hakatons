<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>Latvijas krīzes karte · map.repo.lv</title>
<meta name="description" content="Uzrakstiet, kas notiek un kur: tuvākās evakuācijas un izmitināšanas vietas, patvertnes, slimnīcas, LVĢMC brīdinājumi un plūdu risks no atvērtajiem datiem.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
<link rel="stylesheet" href="stils.css">
</head>
<body>
<header>
  <h1>Krīzes karte</h1>
  <form id="meklet-forma" role="search" class="meklet-rinda">
    <input id="jautajums" type="search" maxlength="300" autocomplete="off" enterkeyhint="search"
           aria-label="Kas Jums vajadzīgs? Kas notiek un kur?" placeholder="Kas Jums vajadzīgs? Piem.: plūdi Ogrē">
    <button type="submit">Meklēt</button>
    <div id="populari" class="populari" role="group" aria-labelledby="populari-virsraksts" hidden>
      <p id="populari-virsraksts">Biežāk meklētais</p>
      <div class="populari-pogas"></div>
    </div>
  </form>
  <div class="galva-labi">
    <p id="statuss" role="status">Ielādē…</p>
    <button id="panelis-poga" type="button" aria-controls="panelis" aria-expanded="true">☰ Filtri</button>
  </div>
</header>
<div id="bridinajums" class="bridinajums" role="status" hidden></div>
<div id="kartes-kluda" class="kartes-kluda" role="alert" hidden></div>
<main>
  <aside id="panelis">
    <section id="meklesana">
      <div id="rezultati" aria-live="polite" hidden></div>
    </section>

    <section id="vieta">
      <div class="meklesana">
        <input id="meklet" type="search" placeholder="Adrese vai nosaukums, piem. Brīvības 15 Ogre" autocomplete="off"
               aria-label="Meklēt adresi (VZD adrešu reģistrs) vai kartē parādītos objektus" aria-controls="mekl-rezultati">
        <ul id="mekl-rezultati" role="listbox" hidden></ul>
      </div>
      <button id="atrast" type="button" class="galvena">📍 Rādīt tuvākos man</button>
      <button id="tuvaka" type="button" class="otra">🏠 Tuvākā patvertne</button>
      <p id="vieta-teksts" class="piezime">Pārlūks prasīs atļauju izmantot tavu atrašanās vietu. Tā netiek saglabāta.</p>
    </section>

    <section>
      <h2><label for="regions">Reģions vai pilsēta</label></h2>
      <select id="regions"><option value="">Visa Latvija</option></select>
    </section>

    <section>
      <h2>Slāņi</h2>
      <div id="kategorijas"></div>
      <label class="kat parklajums"><input type="checkbox" id="pludu-slanis">
        <span class="punkts" style="background:#38bdf8"></span>Plūdu riska zonas (LVĢMC, 1 % un 10 %)</label>
      <details class="grupa" id="avoti">
        <summary><span class="grupa-nos">Datu avoti</span><span class="skaits" id="avoti-skaits"></span></summary>
        <p class="piezime">Kartē izmantoti tikai šie avoti. Katra punkta logā redzams tā avots un licence.</p>
        <ul id="avoti-saraksts"></ul>
      </details>
    </section>
  </aside>
  <div id="kartes-laukums">
    <div id="karte" role="application" aria-label="Karte"></div>
    <div class="kartes-rikis" role="group" aria-label="Kartes vadība">
      <button id="tuvinat" type="button" title="Tuvināt" aria-label="Tuvināt">+</button>
      <button id="talinat" type="button" title="Tālināt" aria-label="Tālināt">−</button>
      <button id="mana-vieta" type="button" title="Mana atrašanās vieta" aria-label="Mana atrašanās vieta">◎</button>
    </div>
    <div class="pamatkarte" role="group" aria-label="Pamatkarte">
      <button type="button" data-pamats="karte" class="aktiva" aria-pressed="true">Karte</button>
      <button type="button" data-pamats="reljefs" aria-pressed="false">Reljefs</button>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
<script>
  // Ja Leaflet (unpkg.com) neielādējas, karte nestrādā — skaidrs paziņojums, nevis tukša lapa
  if (!window.L || !L.markerClusterGroup) {
    var kluda = document.getElementById('kartes-kluda');
    kluda.textContent = 'Karti neizdevās ielādēt (unpkg.com nav pieejams). Pārlādējiet lapu pēc brīža. Ja apdraudēta dzīvība vai veselība, zvaniet 112.';
    kluda.hidden = false;
  }
</script>
<script src="avoti.js"></script>
<script src="klasifikators.js"></script>
<script src="app.js"></script>
<script src="meklesana.js"></script>
<script src="bridinajumi.js"></script>
</body>
</html>
